name: Validate and publish recovery source
on:
  push:
    branches: [recovery-review-2026-11-09]
permissions:
  contents: write
concurrency:
  group: coin-flip-recovery-source
  cancel-in-progress: false
jobs:
  prepare:
    if: github.ref == 'refs/heads/recovery-review-2026-11-09'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Verify pinned baseline and apply the reviewed source patch
        env:
          EXPECTED_BASE: 1864150f880f1cda02e6ed845da88bcc4483c36b
          PATCH_SHA256: ff35c0e741525f642c59ff362f4449827e3adf8b25999b79804781f4b8b67cea
        run: |
          test "$(git rev-parse HEAD^)" = "$EXPECTED_BASE"
          python3 - <<'PYCODE'
          import gzip, hashlib, os, pathlib
          content = pathlib.Path('.recovery/source-update.patch.gz').read_bytes()
          assert hashlib.sha256(content).hexdigest() == os.environ['PATCH_SHA256']
          pathlib.Path('/tmp/coin-flip-recovery.patch').write_bytes(gzip.decompress(content))
          PYCODE
          git apply --check /tmp/coin-flip-recovery.patch
          git apply /tmp/coin-flip-recovery.patch
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install without lifecycle scripts and run offline tests
        run: |
          npm ci --ignore-scripts --no-fund --no-audit
          npm test -- --runInBand
      - name: Build the container and smoke-test credential-free recovery
        run: |
          docker build --tag coin-flip-recovery .
          docker run --rm -d --name recovery-smoke -p 127.0.0.1:3099:3000 coin-flip-recovery
          python3 - <<'PYCODE'
          import json, time, urllib.request
          for attempt in range(30):
              try:
                  data = json.load(urllib.request.urlopen('http://127.0.0.1:3099/health', timeout=1))
                  assert data == {'ready': True, 'mode': 'recovery', 'liveFundsEnabled': False}
                  break
              except Exception:
                  if attempt == 29: raise
                  time.sleep(1)
          PYCODE
          docker stop recovery-smoke
      - name: Publish only the tested source to this recovery branch
        run: |
          git rm .recovery/source-update.patch.gz .github/workflows/apply-recovery.yml
          git add .
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Add tested recovery runtime and deployment diagnostics'
          git push origin HEAD:recovery-review-2026-11-09
