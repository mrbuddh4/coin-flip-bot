name: Recovery and Solana pilot checks
on:
  push:
    branches: [recovery-review-2026-11-09]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: disposable-test-only
          POSTGRES_DB: coinflip_test
        ports: [5432:5432]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts --no-fund --no-audit
      - run: |
          if ! npm test -- --runInBand --silent --json --outputFile=/tmp/coinflip-tests.json; then
            node scripts/report-test-failures.js /tmp/coinflip-tests.json
            exit 1
          fi
        env:
          SOLANA_TEST_DATABASE_URL: postgresql://postgres:disposable-test-only@127.0.0.1:5432/coinflip_test
      - run: npm run deploy:prepare
      - run: docker build -t coinflip-recovery .
      - run: docker run --rm coinflip-recovery npm run deploy:prepare
