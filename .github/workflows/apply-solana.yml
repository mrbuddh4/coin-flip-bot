name: Validate and publish Solana pilot
on:
  push:
    branches: [recovery-review-2026-11-09]
permissions:
  contents: write
concurrency:
  group: coin-flip-solana-source
  cancel-in-progress: false
jobs:
  prepare:
    if: github.ref == 'refs/heads/recovery-review-2026-11-09'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: solana_test
          POSTGRES_PASSWORD: local-ci-only
          POSTGRES_DB: solana_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Verify pinned source and apply reviewed patch
        env:
          EXPECTED_BASE: 61232acefbfc221a5712c589fc60ad0075ad9925
          PATCH_SHA256: 53f2100673a5fb8ad241ca7ba8d6206255bd16cebab0fd79653ce1b41640a4f7
        run: |
          test "$(git rev-parse HEAD^)" = "$EXPECTED_BASE"
          python3 - <<'PYCODE'
          import gzip, hashlib, os, pathlib
          data = pathlib.Path('.recovery/solana-update.patch.gz').read_bytes()
          assert hashlib.sha256(data).hexdigest() == os.environ['PATCH_SHA256']
          pathlib.Path('/tmp/solana-update.patch').write_bytes(gzip.decompress(data))
          PYCODE
          git apply --check /tmp/solana-update.patch
          git apply /tmp/solana-update.patch
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Run offline and real PostgreSQL tests
        env:
          SOLANA_TEST_DATABASE_URL: postgresql://solana_test:local-ci-only@127.0.0.1:5432/solana_test
        run: |
          npm ci --ignore-scripts --no-fund --no-audit
          npm test -- --runInBand
      - name: Build and test recovery container without credentials
        run: |
          docker build --tag coin-flip-solana-pilot .
          docker run --rm -d --name recovery-smoke -e BOT_CHAIN=solana -p 127.0.0.1:3099:3000 coin-flip-solana-pilot
          python3 - <<'PYCODE'
          import json, time, urllib.request
          for attempt in range(30):
              try:
                  data = json.load(urllib.request.urlopen('http://127.0.0.1:3099/health', timeout=1))
                  assert data == {'ready': True, 'mode': 'recovery', 'liveFundsEnabled': False}
                  break
              except Exception:
                  if attempt == 29: raise
                  time.sleep(1)
          PYCODE
          docker stop recovery-smoke
      - name: Publish only tested source to the recovery branch
        run: |
          git rm .recovery/solana-update.patch.gz .github/workflows/apply-solana.yml
          git add .
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Restore SOL and custom SPL devnet games with durable payment ledger'
          git push origin HEAD:recovery-review-2026-11-09
